services:
  # 1. Backend Web Service
  - type: web
    name: quanlysinhvien-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false

  # 2. Frontend Nuxt Web Service
  - type: web
    name: quanlysinhvien-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NUXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: quanlysinhvien-backend
          property: host
