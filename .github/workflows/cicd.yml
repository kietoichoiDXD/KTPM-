name: CI/CD Pipeline - Quan Ly Sinh Vien

on:
  push:
    branches: [main, master, feature/nuxt-frontend, develop]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================
  # JOB 1: Backend Check
  # ==========================================
  backend-check:
    name: Backend Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify all routes load
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'temporary_ci_verify_token' }}
        run: |
          node -e "
          process.env.JWT_SECRET = process.env.JWT_SECRET;
          process.env.MONGO_URI = '';
          process.env.PORT = '5000';
          const routes = ['auth','student','course','grade','attendance','stats','analytics','notification','profile'];
          routes.forEach(r => require('./routes/' + r + '.routes'));
          console.log('All ' + routes.length + ' route modules loaded OK');
          "

  # ==========================================
  # JOB 2: Build Frontend Nuxt
  # ==========================================
  frontend-build:
    name: Frontend Build (Nuxt 4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build Nuxt app
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-build-${{ github.sha }}
          path: frontend/.output/
          include-hidden-files: true
          retention-days: 7

  # ==========================================
  # JOB 3: Deploy Backend to Railway
  # ==========================================
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    needs: [backend-check]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway (if secret configured)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret is not configured. Skipping Railway backend deployment."
            exit 0
          fi
          npm install -g @railway/cli
          if [ -n "$RAILWAY_SERVICE" ]; then
            railway up --service "$RAILWAY_SERVICE" --detach
          else
            railway up --detach
          fi

  # ==========================================
  # JOB 4: Deploy Frontend to Vercel
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [frontend-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Deploy to Vercel (if secret configured)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not configured. Skipping Vercel frontend deployment."
            exit 0
          fi
          npm install -g vercel@latest
          npm install --legacy-peer-deps
          vercel link --yes --token="$VERCEL_TOKEN"
          if [ -n "$NUXT_PUBLIC_API_BASE" ]; then
            echo "$NUXT_PUBLIC_API_BASE" | vercel env add NUXT_PUBLIC_API_BASE production --token="$VERCEL_TOKEN" --force || true
          fi
          vercel deploy --prod --token="$VERCEL_TOKEN" --yes
